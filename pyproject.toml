[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "spark-swarm"
version = "0.1.0"
description = "Centralized Docker task dispatch system"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115",
  "uvicorn>=0.30",
  "sqlalchemy>=2.0",
  "pydantic>=2.7",
  "pydantic-settings>=2.3",
  "httpx>=0.27",
  "typer>=0.12",
  "requests>=2.32",
  "psutil>=5.9",
  "docker>=7.1",
  "python-multipart>=0.0.9",
]

[project.optional-dependencies]
test = [
  "pytest>=8.2",
]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.setuptools]
packages = ["master", "master.api", "agent", "cli"]

[project.scripts]
spark-swarm = "cli.main:app"
