<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Spark-Swarm Dashboard</title>
<style>
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

:root {
  --bg: #0f0f23;
  --card-bg: #1a1a3e;
  --card-hover: #222255;
  --border: #2a2a5a;
  --text: #c8c8e0;
  --text-dim: #8888aa;
  --accent: #00d4ff;
  --green: #00c853;
  --red: #ff1744;
  --yellow: #ffc107;
  --blue: #448aff;
  --orange: #ff9800;
  --gray: #757575;
  --font: 'Segoe UI', system-ui, -apple-system, sans-serif;
  --mono: 'JetBrains Mono', 'Fira Code', 'Cascadia Code', monospace;
}

body {
  background: var(--bg);
  color: var(--text);
  font-family: var(--font);
  min-height: 100vh;
  overflow-x: hidden;
}

/* ── Header ── */
.header {
  background: linear-gradient(135deg, #1a1a3e 0%, #0d0d2b 100%);
  border-bottom: 1px solid var(--border);
  padding: 16px 32px;
  display: flex;
  align-items: center;
  justify-content: space-between;
  flex-wrap: wrap;
  gap: 12px;
}
.header-left { display: flex; align-items: center; gap: 16px; }
.logo { font-size: 1.5rem; font-weight: 700; color: var(--accent); }
.logo span { color: var(--text); font-weight: 300; }
.badge {
  display: inline-flex; align-items: center; gap: 6px;
  padding: 4px 12px; border-radius: 20px; font-size: 0.8rem;
  background: #1a1a3e; border: 1px solid var(--border);
}
.badge .dot { width: 8px; height: 8px; border-radius: 50%; }
.dot.green { background: var(--green); box-shadow: 0 0 6px var(--green); }
.dot.yellow { background: var(--yellow); box-shadow: 0 0 6px var(--yellow); }
.dot.red { background: var(--red); box-shadow: 0 0 6px var(--red); }
.dot.blue { background: var(--blue); box-shadow: 0 0 6px var(--blue); }
.dot.gray { background: var(--gray); }
.header-right { display: flex; align-items: center; gap: 16px; }
.pulse { animation: pulse 1.5s ease-in-out infinite; }
@keyframes pulse { 0%, 100% { opacity: 1; } 50% { opacity: 0.4; } }

/* ── Main Grid ── */
.main {
  display: grid;
  grid-template-columns: 320px 1fr;
  height: calc(100vh - 70px);
  overflow: hidden;
}

/* ── Host Panel ── */
.host-panel {
  background: #0a0a1a;
  border-right: 1px solid var(--border);
  overflow-y: auto;
  padding: 16px;
}
.host-panel h2 {
  font-size: 0.85rem; text-transform: uppercase; letter-spacing: 1px;
  color: var(--text-dim); margin-bottom: 12px;
}
.host-card {
  background: var(--card-bg);
  border: 1px solid var(--border);
  border-radius: 10px;
  padding: 14px;
  margin-bottom: 12px;
  transition: border-color 0.3s;
}
.host-card:hover { border-color: var(--accent); }
.host-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 10px; }
.host-name { font-weight: 600; font-size: 0.95rem; }
.host-ip { font-size: 0.78rem; color: var(--text-dim); font-family: var(--mono); }
.host-status {
  display: flex; align-items: center; gap: 6px;
  font-size: 0.75rem; font-weight: 600; text-transform: uppercase;
}
.resource { margin-bottom: 8px; }
.resource-label {
  display: flex; justify-content: space-between;
  font-size: 0.72rem; margin-bottom: 3px;
}
.resource-label span:last-child { font-family: var(--mono); color: var(--text-dim); }
.bar {
  height: 6px; background: #0d0d2b; border-radius: 3px; overflow: hidden;
}
.bar-fill { height: 100%; border-radius: 3px; transition: width 0.5s ease; }
.bar-fill.cpu { background: linear-gradient(90deg, var(--blue), var(--accent)); }
.bar-fill.mem { background: linear-gradient(90deg, #7c4dff, #b388ff); }
.bar-fill.disk { background: linear-gradient(90deg, #00bfa5, #1de9b6); }
.heartbeat { font-size: 0.7rem; color: var(--text-dim); text-align: right; margin-top: 6px; }

/* ── Task Panel ── */
.task-panel {
  overflow-y: auto;
  padding: 16px 24px;
}

/* Submit form */
.submit-form {
  background: var(--card-bg);
  border: 1px solid var(--border);
  border-radius: 10px;
  margin-bottom: 20px;
  overflow: hidden;
}
.form-header {
  padding: 12px 18px;
  background: #0d0d2b;
  display: flex; justify-content: space-between; align-items: center;
  cursor: pointer;
  user-select: none;
}
.form-header h3 { font-size: 0.9rem; color: var(--accent); }
.form-body { padding: 18px; display: none; }
.form-body.open { display: block; }
.form-row { display: flex; gap: 12px; margin-bottom: 12px; flex-wrap: wrap; }
.form-group { flex: 1; min-width: 120px; }
.form-group label { display: block; font-size: 0.75rem; color: var(--text-dim); margin-bottom: 4px; text-transform: uppercase; letter-spacing: 0.5px; }
.form-group input, .form-group textarea, .form-group select {
  width: 100%; padding: 8px 12px;
  background: #0d0d2b; border: 1px solid var(--border); border-radius: 6px;
  color: var(--text); font-family: var(--font); font-size: 0.85rem;
  resize: vertical;
}
.form-group textarea { font-family: var(--mono); min-height: 80px; }
.form-group input:focus, .form-group textarea:focus, .form-group select:focus {
  outline: none; border-color: var(--accent);
}
.preset-btns { display: flex; gap: 8px; flex-wrap: wrap; }
.preset-btn {
  padding: 4px 12px; font-size: 0.75rem;
  background: #0d0d2b; border: 1px solid var(--border); border-radius: 6px;
  color: var(--accent); cursor: pointer; font-family: var(--mono);
}
.preset-btn:hover { background: #1a1a3e; border-color: var(--accent); }
.btn-submit {
  padding: 10px 28px; font-size: 0.9rem; font-weight: 600;
  background: var(--accent); color: #0f0f23; border: none; border-radius: 8px;
  cursor: pointer; transition: opacity 0.2s;
}
.btn-submit:hover { opacity: 0.85; }
.btn-submit:disabled { opacity: 0.4; cursor: not-allowed; }

/* Task list */
.task-panel h2 {
  font-size: 0.85rem; text-transform: uppercase; letter-spacing: 1px;
  color: var(--text-dim); margin-bottom: 12px;
}
.task-card {
  background: var(--card-bg);
  border: 1px solid var(--border);
  border-radius: 10px;
  padding: 14px 18px;
  margin-bottom: 10px;
  transition: border-color 0.3s, box-shadow 0.3s;
}
.task-card:hover { border-color: var(--accent); }
.task-card.flash { box-shadow: 0 0 16px rgba(0,212,255,0.3); }
.task-top { display: flex; justify-content: space-between; align-items: flex-start; gap: 12px; flex-wrap: wrap; }
.task-info { flex: 1; min-width: 200px; }
.task-name { font-weight: 600; font-size: 0.95rem; margin-bottom: 4px; }
.task-id { font-size: 0.72rem; color: var(--text-dim); font-family: var(--mono); }
.task-meta { display: flex; gap: 12px; margin-top: 6px; font-size: 0.78rem; color: var(--text-dim); flex-wrap: wrap; }
.task-meta span { display: inline-flex; align-items: center; gap: 4px; }
.status-badge {
  display: inline-block; padding: 3px 10px; border-radius: 12px;
  font-size: 0.72rem; font-weight: 700; text-transform: uppercase; letter-spacing: 0.5px;
}
.status-PENDING { background: #75757522; color: var(--gray); border: 1px solid var(--gray); }
.status-SCHEDULED { background: #448aff22; color: var(--blue); border: 1px solid var(--blue); }
.status-BUILDING { background: #ffc10722; color: var(--yellow); border: 1px solid var(--yellow); }
.status-RUNNING { background: #ff980022; color: var(--orange); border: 1px solid var(--orange); }
.status-SUCCESS { background: #00c85322; color: var(--green); border: 1px solid var(--green); }
.status-FAILED { background: #ff174422; color: var(--red); border: 1px solid var(--red); }
.status-CANCELLED { background: #75757522; color: var(--gray); border: 1px solid var(--gray); }
.logs-toggle {
  margin-top: 10px; padding: 6px 14px; font-size: 0.78rem;
  background: #0d0d2b; border: 1px solid var(--border); border-radius: 6px;
  color: var(--accent); cursor: pointer;
}
.logs-toggle:hover { border-color: var(--accent); }
.logs-content {
  display: none; margin-top: 10px;
  background: #0d0d2b; border: 1px solid var(--border); border-radius: 8px;
  padding: 12px; max-height: 300px; overflow: auto;
}
.logs-content.open { display: block; }
.logs-content pre {
  font-family: var(--mono); font-size: 0.78rem; color: #a0a0c0;
  white-space: pre-wrap; word-break: break-all; margin-bottom: 8px;
}
.logs-content pre:last-child { margin-bottom: 0; }
.log-label { font-size: 0.7rem; color: var(--text-dim); text-transform: uppercase; margin-bottom: 4px; }
.empty-state {
  text-align: center; padding: 40px 20px; color: var(--text-dim);
}
.empty-state .icon { font-size: 2.5rem; margin-bottom: 12px; opacity: 0.5; }

/* Scrollbar */
::-webkit-scrollbar { width: 6px; }
::-webkit-scrollbar-track { background: transparent; }
::-webkit-scrollbar-thumb { background: var(--border); border-radius: 3px; }
::-webkit-scrollbar-thumb:hover { background: #3a3a6a; }

/* Loading shimmer */
@keyframes shimmer { 0% { background-position: -200px 0; } 100% { background-position: 200px 0; } }
</style>
</head>
<body>

<header class="header">
  <div class="header-left">
    <div class="logo">Spark<span>Swarm</span></div>
    <div class="badge">
      <span class="dot green"></span>
      <span id="agents-count">--</span> Agents
    </div>
    <div class="badge">
      <span class="dot blue"></span>
      <span id="tasks-count">--</span> Tasks
    </div>
  </div>
  <div class="header-right">
    <span style="font-size:0.78rem;color:var(--text-dim)">API: localhost:8000</span>
    <span class="pulse" style="font-size:0.78rem;color:var(--accent)">LIVE</span>
  </div>
</header>

<main class="main">
  <!-- ── Host Panel ── -->
  <aside class="host-panel" id="host-panel">
    <h2>Worker Hosts</h2>
    <div id="host-list">
      <div class="empty-state">
        <div class="icon">🖥️</div>
        <div>Waiting for agents...</div>
      </div>
    </div>
  </aside>

  <!-- ── Task Panel ── -->
  <section class="task-panel">
    <div class="submit-form" id="submit-form">
      <div class="form-header" onclick="toggleForm()">
        <h3 id="form-title">+ Submit New Task</h3>
      </div>
      <div class="form-body" id="form-body">
        <div class="form-row">
          <div class="form-group" style="flex:2">
            <label>Task Name</label>
            <input type="text" id="task-name" placeholder="my-task" value="hello-world">
          </div>
          <div class="form-group">
            <label>CPU Limit</label>
            <input type="number" id="task-cpu" placeholder="auto" step="0.1" min="0">
          </div>
          <div class="form-group">
            <label>Memory (MB)</label>
            <input type="number" id="task-mem" placeholder="auto" step="1" min="0">
          </div>
          <div class="form-group">
            <label>Timeout (s)</label>
            <input type="number" id="task-timeout" placeholder="none" step="1" min="1" value="60">
          </div>
        </div>
        <div class="form-row">
          <div class="form-group" style="flex:1">
            <label>Quick Load</label>
            <div class="preset-btns">
              <button class="preset-btn" onclick="loadPreset('hello')">hello demo</button>
              <button class="preset-btn" onclick="loadPreset('fail')">fail demo</button>
              <button class="preset-btn" onclick="loadPreset('output')">output demo</button>
            </div>
          </div>
        </div>
        <div class="form-row">
          <div class="form-group" style="flex:1">
            <label>Dockerfile Content</label>
            <textarea id="task-dockerfile" rows="5" placeholder="FROM alpine:latest&#10;CMD echo hello"></textarea>
          </div>
        </div>
        <button class="btn-submit" id="btn-submit" onclick="submitTask()">Submit Task</button>
      </div>
    </div>

    <h2>Tasks</h2>
    <div id="task-list">
      <div class="empty-state">
        <div class="icon">📋</div>
        <div>No tasks yet. Submit one above!</div>
      </div>
    </div>
  </section>
</main>

<script>
// ── Preset data ──
const PRESETS = {
  hello: {
    name: 'hello-world',
    dockerfile: 'FROM alpine:latest\nRUN echo "Hello from Spark-Swarm!"\nRUN echo "Build completed at $(date)"\nCMD echo "Container is running..." && sleep 2 && echo "Task finished successfully!"\n'
  },
  fail: {
    name: 'build-fail',
    dockerfile: 'FROM alpine:latest\nRUN this-command-does-not-exist\nCMD echo "This should never run"\n'
  },
  output: {
    name: 'output-files',
    dockerfile: 'FROM alpine:latest\nRUN echo "Creating output files..."\nRUN mkdir -p /output\nRUN echo "This is the output content" > /output/result.txt\nRUN echo \'{"key": "value", "status": "ok"}\' > /output/data.json\nRUN echo "Log line 1" && sleep 1 && echo "Log line 2" && sleep 1 && echo "Log line 3"\nCMD echo "Processing complete"\n'
  }
};

let formOpen = false;

function toggleForm() {
  formOpen = !formOpen;
  document.getElementById('form-body').classList.toggle('open', formOpen);
  document.getElementById('form-title').textContent = formOpen ? '▾ Submit New Task' : '+ Submit New Task';
}

function loadPreset(key) {
  const p = PRESETS[key];
  document.getElementById('task-name').value = p.name;
  document.getElementById('task-dockerfile').value = p.dockerfile;
  document.getElementById('task-cpu').value = '';
  document.getElementById('task-mem').value = '';
  document.getElementById('task-timeout').value = '60';
  // Auto-expand form
  if (!formOpen) toggleForm();
  // Flash to show it's loaded
  const ta = document.getElementById('task-dockerfile');
  ta.style.borderColor = '#00d4ff';
  setTimeout(() => ta.style.borderColor = '', 600);
}

async function submitTask() {
  const btn = document.getElementById('btn-submit');
  const name = document.getElementById('task-name').value.trim();
  const dockerfile = document.getElementById('task-dockerfile').value.trim();
  if (!name || !dockerfile) { alert('Task name and Dockerfile content are required.'); return; }

  btn.disabled = true;
  btn.textContent = 'Submitting...';

  const body = { name, dockerfile_content: dockerfile, priority: 10 };
  const cpu = parseFloat(document.getElementById('task-cpu').value);
  const mem = parseInt(document.getElementById('task-mem').value);
  const timeout = parseInt(document.getElementById('task-timeout').value);
  if (cpu > 0) body.cpu_limit = cpu;
  if (mem > 0) body.memory_limit_mb = mem;
  if (timeout > 0) body.timeout_seconds = timeout;

  try {
    const resp = await fetch('/api/v1/tasks', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify(body)
    });
    if (!resp.ok) {
      const err = await resp.json();
      throw new Error(err.detail || resp.statusText);
    }
    // Clear form
    document.getElementById('task-name').value = '';
    document.getElementById('task-dockerfile').value = '';
    // Immediately refresh
    fetchData();
  } catch (e) {
    alert('Submit failed: ' + e.message);
  } finally {
    btn.disabled = false;
    btn.textContent = 'Submit Task';
  }
}

// ── Data fetching ──
let lastTaskStatuses = {};
let taskDetails = {};       // taskId → detail (with logs)
let hostMap = {};           // hostId → hostname + ip
let expandedLogs = new Set();

async function fetchData() {
  try {
    const [hostsResp, tasksResp] = await Promise.all([
      fetch('/api/v1/hosts'),
      fetch('/api/v1/tasks')
    ]);
    const hosts = hostsResp.ok ? await hostsResp.json() : [];
    const tasks = tasksResp.ok ? await tasksResp.json() : [];

    hostMap = {};
    hosts.forEach(h => { hostMap[h.id] = h.hostname || h.ip_address; });

    // Fetch details for completed tasks we haven't cached yet
    const finalStatuses = ['SUCCESS', 'FAILED', 'CANCELLED'];
    const toFetch = tasks.filter(t => finalStatuses.includes(t.status) && !taskDetails[t.id]);
    if (toFetch.length) {
      const details = await Promise.allSettled(
        toFetch.map(t => fetch('/api/v1/tasks/' + t.id).then(r => r.ok ? r.json() : null))
      );
      toFetch.forEach((t, i) => {
        if (details[i].status === 'fulfilled' && details[i].value) {
          taskDetails[t.id] = details[i].value;
        }
      });
    }

    // Merge cached details into task list
    const enriched = tasks.map(t => ({ ...t, ...(taskDetails[t.id] || {}) }));

    renderHosts(hosts);
    renderTasks(enriched);
    updateHeader(hosts, enriched);
  } catch (_) { /* master not up yet */ }
}

function updateHeader(hosts, tasks) {
  document.getElementById('agents-count').textContent = hosts.filter(h => h.status === 'ONLINE').length;
  document.getElementById('tasks-count').textContent = tasks.length;
}

// ── Render hosts ──
function renderHosts(hosts) {
  const container = document.getElementById('host-list');
  if (!hosts.length) {
    container.innerHTML = '<div class="empty-state"><div class="icon">🖥️</div><div>Waiting for agents...</div></div>';
    return;
  }
  container.innerHTML = hosts.map(h => {
    const cpuPct = h.cpu_total > 0 ? ((h.cpu_total - h.cpu_available) / h.cpu_total * 100).toFixed(0) : 0;
    const memPct = h.memory_total_mb > 0 ? ((h.memory_total_mb - h.memory_available_mb) / h.memory_total_mb * 100).toFixed(0) : 0;
    const diskPct = h.disk_total_mb > 0 ? ((h.disk_total_mb - h.disk_available_mb) / h.disk_total_mb * 100).toFixed(0) : 0;
    const online = h.status === 'ONLINE';
    const age = h.last_heartbeat ? Math.round((Date.now() - new Date(h.last_heartbeat + 'Z').getTime()) / 1000) : '?';
    return `
      <div class="host-card">
        <div class="host-header">
          <div>
            <div class="host-name">${esc(h.hostname)}</div>
            <div class="host-ip">${esc(h.ip_address)}</div>
          </div>
          <div class="host-status" style="color:${online ? 'var(--green)' : 'var(--red)'}">
            <span class="dot ${online ? 'green' : 'red'}"></span> ${online ? 'ONLINE' : 'OFFLINE'}
          </div>
        </div>
        <div class="resource">
          <div class="resource-label"><span>CPU</span><span>${h.cpu_available.toFixed(1)} / ${h.cpu_total} cores</span></div>
          <div class="bar"><div class="bar-fill cpu" style="width:${cpuPct}%"></div></div>
        </div>
        <div class="resource">
          <div class="resource-label"><span>Memory</span><span>${fmtMb(h.memory_available_mb)} / ${fmtMb(h.memory_total_mb)}</span></div>
          <div class="bar"><div class="bar-fill mem" style="width:${memPct}%"></div></div>
        </div>
        <div class="resource">
          <div class="resource-label"><span>Disk</span><span>${fmtMb(h.disk_available_mb)} / ${fmtMb(h.disk_total_mb)}</span></div>
          <div class="bar"><div class="bar-fill disk" style="width:${diskPct}%"></div></div>
        </div>
        <div class="heartbeat">Last heartbeat: ${age}s ago</div>
      </div>`;
  }).join('');
}

// ── Render tasks ──
function renderTasks(tasks) {
  const container = document.getElementById('task-list');
  if (!tasks.length) {
    container.innerHTML = '<div class="empty-state"><div class="icon">📋</div><div>No tasks yet. Submit one above!</div></div>';
    lastTaskStatuses = {};
    expandedLogs.clear();
    return;
  }

  // Save scroll positions of open logs before rebuild
  const scrollPos = {};
  expandedLogs.forEach(id => {
    const el = document.getElementById('logs-' + id);
    if (el) scrollPos[id] = el.scrollTop;
  });

  container.innerHTML = tasks.map(t => {
    const status = t.status;
    const changed = lastTaskStatuses[t.id] && lastTaskStatuses[t.id] !== status;
    lastTaskStatuses[t.id] = status;

    const duration = t.started_at
      ? fmtDuration((t.completed_at ? new Date(t.completed_at + 'Z') : new Date()) - new Date(t.started_at + 'Z'))
      : '';
    const hostLabel = t.assigned_host_id ? (hostMap[t.assigned_host_id] || t.assigned_host_id.slice(0, 8)) : '—';

    let extraInfo = '';
    if (status === 'SUCCESS' && t.exit_code !== null) extraInfo = `exit=${t.exit_code}`;
    if (status === 'FAILED') extraInfo = t.error_message ? esc(truncate(t.error_message, 80)) : '';

    return `
      <div class="task-card ${changed ? 'flash' : ''}" id="task-${t.id}">
        <div class="task-top">
          <div class="task-info">
            <div class="task-name">${esc(t.name)}</div>
            <div class="task-id">${t.id.slice(0, 12)}...</div>
            <div class="task-meta">
              ${duration ? `<span>⏱ ${duration}</span>` : ''}
              <span>🖥 ${hostLabel}</span>
              ${extraInfo ? `<span>${extraInfo}</span>` : ''}
            </div>
          </div>
          <span class="status-badge status-${status}">${status}</span>
        </div>
        ${(t.stdout_log || t.stderr_log) ? `
          <button class="logs-toggle" onclick="toggleLogs('${t.id}')">Show Logs ▸</button>
          <div class="logs-content" id="logs-${t.id}">
            ${t.stdout_log ? `<div class="log-label">stdout</div><pre>${esc(t.stdout_log)}</pre>` : ''}
            ${t.stderr_log ? `<div class="log-label">stderr</div><pre>${esc(t.stderr_log)}</pre>` : ''}
          </div>
        ` : ''}
      </div>`;
  }).join('');

  // Re-expand logs and restore scroll position
  expandedLogs.forEach(id => {
    const el = document.getElementById('logs-' + id);
    const btn = el?.previousElementSibling;
    if (el && btn) {
      el.classList.add('open');
      btn.textContent = 'Hide Logs ▾';
      if (scrollPos[id] !== undefined) el.scrollTop = scrollPos[id];
    }
  });

  // Clear flash after animation
  if (Object.values(lastTaskStatuses).some(s => s)) {
    setTimeout(() => {
      document.querySelectorAll('.task-card.flash').forEach(el => el.classList.remove('flash'));
    }, 600);
  }
}

function toggleLogs(taskId) {
  const el = document.getElementById('logs-' + taskId);
  if (!el) return;
  const open = el.classList.toggle('open');
  if (open) expandedLogs.add(taskId);
  else expandedLogs.delete(taskId);
  const btn = el.previousElementSibling;
  btn.textContent = open ? 'Hide Logs ▾' : 'Show Logs ▸';
}

// ── Utilities ──
function esc(s) {
  if (!s) return '';
  const div = document.createElement('div');
  div.textContent = s;
  return div.innerHTML;
}
function fmtMb(mb) {
  if (mb >= 1024) return (mb / 1024).toFixed(1) + ' GB';
  return mb + ' MB';
}
function fmtDuration(ms) {
  if (ms < 0) return '0s';
  const s = ms / 1000;
  if (s < 60) return s.toFixed(1) + 's';
  return Math.floor(s / 60) + 'm ' + (s % 60).toFixed(0) + 's';
}
function truncate(s, n) { return s.length > n ? s.slice(0, n) + '...' : s; }
